experiment:
  name: random_forest_position_salary
  task: regression
  random_state: 42

data:
  path: data/raw/regression/position_salaries.csv
  target: Salary
  features: [Level]
  test_size: 0.2

model:
  type: random_forest_regressor
  params:
    n_estimators: 300
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: 1.0     # for 1 feature dataset; can be "sqrt" for multi-feature
    bootstrap: true
    n_jobs: -1

outputs:
  dir: exports
